<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1030;--paper:#fff3dc;--pink:#ff3d9a;--yellow:#ffd60a;--cyan:#22d3ee;--lime:#b8f03c;--violet:#8b5cf6;--orange:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:700;color:var(--ink);background:var(--paper);
 background-image:radial-gradient(rgba(27,16,48,.14) 1.3px,transparent 1.5px);background-size:26px 26px;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.pill,.btn,select,.opt{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;color:var(--ink);font:800 14px 'Nunito',sans-serif;cursor:pointer;transition:transform .12s,box-shadow .12s}
.pill:hover,.btn:hover,select:hover,.opt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.pill:active,.btn:active,.opt:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 0}
.left{display:flex;align-items:center;gap:12px}
.pill{border-radius:999px;padding:9px 16px;display:inline-flex;align-items:center;gap:6px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font:800 16px 'Unbounded';transform:rotate(-6deg)}
h1{font:800 18px/1 'Unbounded'}
.ctrl{display:flex;align-items:center;gap:10px}
select{border-radius:999px;padding:9px 14px;appearance:none;-webkit-appearance:none;max-width:190px}
#btn-auto-audio.on{background:var(--lime)}

.stats{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px;font-size:15px}
.score{display:flex;gap:10px}
.score span{border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;box-shadow:2px 2px 0 var(--ink)}
.s-ok{background:var(--lime)}.s-bad{background:var(--pink);color:#fff}
.bar{height:20px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-bottom:26px}
#progress-bar{height:100%;width:0;background:var(--pink);border-right:3px solid var(--ink);transition:width .3s}

.stage{perspective:1000px;height:380px;cursor:pointer;user-select:none;margin-bottom:24px}
#flashcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
#flashcard.rotate-y-180{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink);padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.front{background:var(--yellow)}
.back{background:var(--violet);color:#fff;transform:rotateY(180deg)}
.row{display:flex;justify-content:space-between;align-items:center}
#card-art{border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:3px 14px;font-size:14px;font-weight:800}
#card-art[data-art=der]{background:var(--cyan)}#card-art[data-art=die]{background:var(--pink);color:#fff}
#card-art[data-art=das]{background:var(--lime)}#card-art[data-art=verb]{background:var(--orange)}
.speak{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:20px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.speak:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.mid{text-align:center}
#card-word-de{font:800 clamp(30px,7vw,44px)/1.1 'Unbounded';overflow-wrap:anywhere}
#card-pl{margin-top:8px;font-size:16px;opacity:.75}
#card-word-ru{font:800 clamp(26px,6vw,38px)/1.15 'Unbounded';color:var(--yellow);overflow-wrap:anywhere}
.ex{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;text-align:left}
.ex small{display:block;font-size:12px;opacity:.6;margin-bottom:2px}
.ex p{font-size:15px;line-height:1.35}
.hint{text-align:center;font-size:13px;opacity:.7}
#card-category-tag{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}

.quiz{background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:16px;margin-bottom:22px}
.qhead{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:12px}
.status{opacity:.6}.status.ok{color:#2d8a00;opacity:1;font-weight:800}.status.bad{color:#d10068;opacity:1;font-weight:800}
#options-container{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border-radius:16px;padding:12px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.opt .mark{font-size:16px;opacity:.35}
.opt:disabled{cursor:default}.opt:disabled:hover{transform:none;box-shadow:3px 3px 0 var(--ink)}
.opt.right{background:var(--lime)}.opt.right .mark{opacity:1}
.opt.wrong{background:var(--pink);color:#fff}.opt.wrong .mark{opacity:1}

.nav{display:flex;gap:14px;padding-bottom:40px}
.btn{flex:1;border-radius:999px;padding:14px 18px;font-size:16px;display:flex;justify-content:center;align-items:center;gap:8px}
#btn-next{background:var(--pink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}

.tabs{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 14px}
.modes,.levels{display:flex;gap:10px;flex-wrap:wrap}
.tab,.lvl{border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:800 14px 'Nunito',sans-serif;padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.tab:hover,.lvl:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.tab:active,.lvl:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.tab.on{background:var(--pink);color:#fff}
.tab b{background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px;margin-left:4px;font-size:12px}
.lvl.on{background:var(--yellow)}
.lvl small{opacity:.55;margin-left:5px;font-size:12px}
.lvl.empty:not(.on){background:#f4ecd9}
.s-skip{background:var(--yellow)}
.pill.small{padding:7px 14px;font-size:13px}
.opt.peek{background:var(--yellow)}.opt.peek .mark{opacity:1}
select:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
@media(max-width:520px){.stage{height:410px}#options-container{grid-template-columns:1fr}.btn span.t{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="left">
      <a href="../../index.html" onclick="if (history.length > 1) { history.back(); return false; }" class="pill" title="Назад на главную">← Назад</a>
      <div class="logo">DE</div>
      <h1>Карточки</h1>
    </div>
    <div class="ctrl">
      <select id="letter-filter" aria-label="Буква"><option value="ALL">Все буквы</option></select>
      <button id="btn-shuffle" class="pill" type="button" title="Перемешать">🎲 Микс</button>
      <button id="btn-auto-audio" class="pill" type="button" title="Автопроизношение"><span id="audio-icon">🔊</span></button>
    </div>
  </header>

  <div class="tabs">
    <div class="modes">
      <button id="tab-learn" class="tab on" type="button">🎴 Учить</button>
      <button id="tab-review" class="tab" type="button">🔁 Повторение <b id="review-count">0</b></button>
    </div>
    <div class="levels" id="levels" role="group" aria-label="Уровень"></div>
    <button id="btn-clear-review" class="pill small" type="button" hidden>🗑 Очистить список</button>
  </div>

  <div class="stats">
    <span id="card-counter">Карточка 0 из 0</span>
    <div class="score"><span class="s-ok">✓ <b id="score-correct">0</b></span><span class="s-bad">✕ <b id="score-wrong">0</b></span><span class="s-skip" title="Пропущено или подсмотрено">👀 <b id="score-skip">0</b></span></div>
  </div>
  <div class="bar"><div id="progress-bar"></div></div>

  <div class="stage" id="flashcard-container">
    <div id="flashcard">
      <div class="face front">
        <div class="row">
          <span id="card-art">---</span>
          <button class="speak" type="button" title="Прослушать" onclick="event.stopPropagation(); speakGerman();">🔊</button>
        </div>
        <div class="mid">
          <h2 id="card-word-de">Загрузка...</h2>
          <p id="card-pl">---</p>
        </div>
        <div class="ex"><small>Пример</small><p id="card-ex-de">---</p></div>
        <div class="hint">Нажми на карточку, чтобы перевернуть 👆</div>
      </div>
      <div class="face back">
        <div class="row">
          <span style="font-size:14px;font-weight:800">Перевод</span>
          <span id="card-category-tag">Буква</span>
        </div>
        <div class="mid"><h2 id="card-word-ru">---</h2></div>
        <div class="ex"><small>Пример</small><p id="card-ex-ru">---</p></div>
        <div class="hint">Нажми, чтобы вернуть немецкую сторону</div>
      </div>
    </div>
  </div>

  <div class="quiz">
    <div class="qhead"><b>Выбери правильный перевод</b><span id="quiz-status" class="status">Выберите 1 из 4</span></div>
    <div id="options-container"></div>
  </div>

  <div class="nav">
    <button id="btn-prev" class="btn" type="button">← <span class="t">Назад</span></button>
    <button id="btn-next" class="btn" type="button"><span class="t">Далее</span> →</button>
  </div>
</div>

        let skipCount = 0;
        let mode = 'learn';
        let level = 'A1';
        const LEVELS = ['A1', 'A2', 'B1', 'B2'];
        const REVIEW_KEY = 'dfc_review_v1';
        let review = {};

        // Кэш элементов DOM
        const flashcardContainer = document.getElementById('flashcard-container');
        const flashcard = document.getElementById('flashcard');
        const cardArt = document.getElementById('card-art');
        const cardWordDe = document.getElementById('card-word-de');
        const cardPl = document.getElementById('card-pl');
        const cardExDe = document.getElementById('card-ex-de');
        const cardWordRu = document.getElementById('card-word-ru');
        const cardExRu = document.getElementById('card-ex-ru');
        const cardCategoryTag = document.getElementById('card-category-tag');
        const cardCounter = document.getElementById('card-counter');
        const progressBar = document.getElementById('progress-bar');
        const letterFilter = document.getElementById('letter-filter');
        const optionsContainer = document.getElementById('options-container');
        const quizStatus = document.getElementById('quiz-status');
        const scoreCorrectEl = document.getElementById('score-correct');
        const scoreWrongEl = document.getElementById('score-wrong');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnAutoAudio = document.getElementById('btn-auto-audio');
        const audioIcon = document.getElementById('audio-icon');
        const btnTheme = document.getElementById('btn-theme');
        const themeIcon = document.getElementById('theme-icon');
        const scoreSkipEl = document.getElementById('score-skip');
        const tabLearn = document.getElementById('tab-learn');
        const tabReview = document.getElementById('tab-review');
        const reviewCountEl = document.getElementById('review-count');
        const levelsEl = document.getElementById('levels');
        const btnClearReview = document.getElementById('btn-clear-review');

        // Тасование массива (Fisher-Yates)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Инициализация базы и списка букв
        function initializeDataset() {
            allWordsList = [];
            Object.keys(rawFlashcardsData).sort().forEach(letter => {
                rawFlashcardsData[letter].forEach(item => {
                    allWordsList.push({ ...item, category: letter, level: item.level || 'A1' });
                });
            });
            loadReview();
            populateLetters();
            renderLevels();
            buildDeck();
        }

        // Генерация 4 вариантов ответов (1 правильный, 3 случайных)
        function generateQuizOptions(currentCard) {
            optionsContainer.innerHTML = '';
            optionSelected = false;
            quizStatus.textContent = 'Выберите 1 из 4';
            quizStatus.className = 'status';

            const correctRu = currentCard.ru;
            
            // Получаем список всех доступных переходов, исключая правильный
            const otherTranslations = [...new Set(allWordsList.map(w => w.ru).filter(ru => ru !== correctRu))];
            const shuffledOthers = shuffleArray(otherTranslations);
            const wrongChoices = shuffledOthers.slice(0, 3);

            // Собираем 4 варианта и перемешиваем
            const choices = shuffleArray([correctRu, ...wrongChoices]);

            choices.forEach(choiceText => {
                const btn = document.createElement('button');
                btn.className = 'opt';
                btn.innerHTML = `<span>${choiceText}</span> <b class="mark">○</b>`;
                
                btn.dataset.val = choiceText;
                btn.onclick = () => handleOptionClick(btn, choiceText, correctRu);
                optionsContainer.appendChild(btn);
            });
        }

        // Обработка выбора ответа пользователем
        function handleOptionClick(selectedBtn, selectedText, correctText) {
            if (optionSelected) return; // Защита от повторного клика
            optionSelected = true;

            const allButtons = optionsContainer.querySelectorAll('button');

            if (selectedText === correctText) {
                // Правильный ответ
                selectedBtn.className = 'opt right';
                selectedBtn.querySelector('.mark').textContent = '✓';
                const curW = activeDeck[currentIndex];
                const wasInReview = !!review[curW.de];
                clearFromReview(curW);
                correctCount++;
                scoreCorrectEl.textContent = correctCount;
                quizStatus.textContent = wasInReview ? 'Верно! Убрано из повторения' : 'Верно!';
                quizStatus.className = 'status ok';

                // Авто-переворот карточки через короткую паузу для наглядности
                setTimeout(() => {
                    if (!isFlipped) flipCard();
                }, 400);

            } else {
                // Ошибка
                selectedBtn.className = 'opt wrong';
                selectedBtn.querySelector('.mark').textContent = '✕';
                wrongCount++;
                markReview(activeDeck[currentIndex], 'wrong');
                scoreWrongEl.textContent = wrongCount;
                quizStatus.textContent = 'Неверно: в повторение';
                quizStatus.className = 'status bad';

                // Подсветка правильного ответа
                allButtons.forEach(btn => {
                    if (btn.dataset.val === correctText) {
                        btn.className = 'opt right';
                        btn.querySelector('.mark').textContent = '✓';
                    }
                });

                // Переворачиваем карточку, чтобы показать перевод
                setTimeout(() => {
                    if (!isFlipped) flipCard();
                }, 600);
            }

            // Отключаем остальные варианты
            allButtons.forEach(btn => btn.disabled = true);
        }

        // Обновление интерфейса для текущей карточки
        function updateUI() {
            if (!activeDeck || activeDeck.length === 0) {
                if (isFlipped) { isFlipped = false; flashcard.classList.remove('rotate-y-180'); }
                cardArt.textContent = "—";
                cardArt.dataset.art = "";
                quizStatus.textContent = "";
                if (mode === 'review') {
                    cardWordDe.textContent = "Пока пусто 🎉";
                } else if (levelWords().length === 0) {
                    cardWordDe.textContent = "Скоро здесь будут слова";
                } else {
                    cardWordDe.textContent = "Слова не найдены";
                }
                cardPl.textContent = "";
                cardExDe.textContent = mode === 'review'
                    ? "Ошибок и пропусков нет. Слова, в которых вы ошибётесь или которые пропустите, появятся здесь."
                    : (levelWords().length === 0 ? `В уровне ${level} пока нет слов.` : "Выберите другую букву.");
                cardWordRu.textContent = "—";
                cardExRu.textContent = "—";
                cardCounter.textContent = "0 из 0";
                progressBar.style.width = "0%";
                optionsContainer.innerHTML = '';
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            // Возврат в переднее положение
            if (isFlipped) {
                isFlipped = false;
                flashcard.classList.remove('rotate-y-180');
            }

            const current = activeDeck[currentIndex];

            // Заполнение карточки
            cardArt.textContent = current.art || "слово";
            cardArt.dataset.art = current.art || "";
            cardWordDe.textContent = current.de;
            if (!current.pl || current.pl === "-") {
                cardPl.textContent = "";
            } else if (current.art === "verb") {
                cardPl.textContent = `Формы: ${current.pl}`;
            } else if (/^(без|только)/.test(current.pl)) {
                cardPl.textContent = current.pl.charAt(0).toUpperCase() + current.pl.slice(1);
            } else {
                cardPl.textContent = `Мн.ч.: ${current.pl}`;
            }
            cardExDe.textContent = current.exDe || "—";
            cardWordRu.textContent = current.ru;
            cardExRu.textContent = current.exRu || "—";
            cardCategoryTag.textContent = `${current.level} · Буква ${current.category}`;

            // Индикаторы и прогресс
            const total = activeDeck.length;
            cardCounter.textContent = mode === 'review'
                ? `Повторение ${currentIndex + 1} из ${total} · ${review[current.de] === 'wrong' ? '❌ ошибка' : (review[current.de] ? '👀 пропуск' : '✅ выучено')}`
                : `Карточка ${currentIndex + 1} из ${total}`;
            const percent = ((currentIndex + 1) / total) * 100;
            progressBar.style.width = `${percent}%`;

            // Состояние кнопок навигации
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === total - 1;

            // Генерация вариантов ответов
            generateQuizOptions(current);

            // Озвучка при включенном режиме
            if (autoAudio) {
                speakGerman();
            }
        }

        // Переворот карточки (Только кликом по самой карточке)
        function flipCardRaw() {
            if (activeDeck.length === 0) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcard.classList.add('rotate-y-180');
            } else {
                flashcard.classList.remove('rotate-y-180');
            }
        }

        // Навигация
        function nextCard() {
            if (currentIndex < activeDeck.length - 1) {
                finishCurrent();
                currentIndex++;
                updateUI();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                finishCurrent();
                currentIndex--;
                updateUI();
            }
        }

        // Произношение (Google/Browser Speech Synthesis)
        function speakGerman() {
            if ('speechSynthesis' in window && activeDeck[currentIndex]) {
                window.speechSynthesis.cancel();
                const text = activeDeck[currentIndex].de;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Слушатели событий
        flashcardContainer.addEventListener('click', flipCard);

        letterFilter.addEventListener('change', buildDeck);

        btnShuffle.addEventListener('click', () => {
            if (activeDeck.length > 0) {
                activeDeck = shuffleArray(activeDeck);
                currentIndex = 0;
                updateUI();
            }
        });

        btnAutoAudio.addEventListener('click', () => {
            autoAudio = !autoAudio;
            btnAutoAudio.classList.toggle('on', autoAudio);
            if (autoAudio) speakGerman();
        });

        
        btnNext.addEventListener('click', nextCard);
        btnPrev.addEventListener('click', prevCard);

        // Горячие клавиши
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        });

        // ---- Повторение ----
        function loadReview() {
            try { review = JSON.parse(localStorage.getItem(REVIEW_KEY)) || {}; } catch (e) { review = {}; }
            updateReviewBadge();
        }
        function saveReview() {
            try { localStorage.setItem(REVIEW_KEY, JSON.stringify(review)); } catch (e) {}
            updateReviewBadge();
        }
        function updateReviewBadge() { reviewCountEl.textContent = Object.keys(review).length; }
        function markReview(word, type) {
            if (type === 'skip' && review[word.de] === 'wrong') return;
            review[word.de] = type;
            saveReview();
        }
        function clearFromReview(word) {
            if (review[word.de]) { delete review[word.de]; saveReview(); }
        }
        // Пропуск: ушли с карточки, не ответив
        function finishCurrent() {
            if (!activeDeck.length || optionSelected) return;
            markReview(activeDeck[currentIndex], 'skip');
            skipCount++;
            scoreSkipEl.textContent = skipCount;
        }
        // Подсмотрел: перевернул до ответа, не засчитывается
        function registerPeek() {
            optionSelected = true;
            const cur = activeDeck[currentIndex];
            markReview(cur, 'skip');
            skipCount++;
            scoreSkipEl.textContent = skipCount;
            optionsContainer.querySelectorAll('button').forEach(b => {
                b.disabled = true;
                if (b.dataset.val === cur.ru) {
                    b.className = 'opt peek';
                    const m = b.querySelector('.mark');
                    if (m) m.textContent = '✓';
                }
            });
            quizStatus.textContent = 'Подсмотрел: не засчитано';
            quizStatus.className = 'status';
        }
        function flipCard() {
            if (activeDeck.length === 0) return;
            const toBack = !isFlipped;
            flipCardRaw();
            if (toBack && !optionSelected) registerPeek();
        }

        // ---- Уровни, буквы, вкладки ----
        function levelWords() { return allWordsList.filter(w => w.level === level); }
        function buildDeck() {
            let list;
            if (mode === 'review') {
                list = allWordsList.filter(w => review[w.de]);
            } else {
                list = levelWords();
                if (letterFilter.value !== 'ALL') list = list.filter(w => w.category === letterFilter.value);
            }
            activeDeck = shuffleArray(list);
            currentIndex = 0;
            updateUI();
        }
        function populateLetters() {
            const words = levelWords();
            const counts = {};
            words.forEach(w => { counts[w.category] = (counts[w.category] || 0) + 1; });
            letterFilter.innerHTML = '';
            const all = document.createElement('option');
            all.value = 'ALL';
            all.textContent = `Все буквы (${words.length})`;
            letterFilter.appendChild(all);
            Object.keys(counts).sort().forEach(l => {
                const o = document.createElement('option');
                o.value = l;
                o.textContent = `Буква "${l}" (${counts[l]})`;
                letterFilter.appendChild(o);
            });
        }
        function renderLevels() {
            levelsEl.innerHTML = '';
            LEVELS.forEach(l => {
                const n = allWordsList.filter(w => w.level === l).length;
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'lvl' + (l === level ? ' on' : '') + (n === 0 ? ' empty' : '');
                b.innerHTML = `${l}<small>${n}</small>`;
                b.onclick = () => { level = l; populateLetters(); renderLevels(); buildDeck(); };
                levelsEl.appendChild(b);
            });
        }
        function setMode(m) {
            mode = m;
            tabLearn.classList.toggle('on', m === 'learn');
            tabReview.classList.toggle('on', m === 'review');
            levelsEl.hidden = (m === 'review');
            letterFilter.disabled = (m === 'review');
            btnClearReview.hidden = (m !== 'review');
            buildDeck();
        }
        tabLearn.addEventListener('click', () => setMode('learn'));
        tabReview.addEventListener('click', () => setMode('review'));
        btnClearReview.addEventListener('click', () => {
            if (Object.keys(review).length && confirm('Очистить список повторения?')) {
                review = {};
                saveReview();
                buildDeck();
            }
        });

        // Запуск
        window.onload = function() {
            initializeDataset();
        };
    
</script>
</body>
</html>
