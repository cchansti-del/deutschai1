<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат с ИИ — DeutschAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b1030;
  --paper: #fff3dc;
  --pink: #ff3d9a;
  --yellow: #ffd60a;
  --cyan: #22d3ee;
  --lime: #b8f03c;
  --violet: #8b5cf6;
  --orange: #ff7a1a;
  --display: 'Unbounded', system-ui, sans-serif;
  --body: 'Nunito', system-ui, sans-serif;
  --line: 3px solid var(--ink);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--body);
  font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  background-image: radial-gradient(rgba(27,16,48,.14) 1.3px, transparent 1.5px);
  background-size: 26px 26px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }

.wrap { max-width: 860px; width: 100%; margin: 0 auto; padding: 0 16px; flex: 1; display: flex; flex-direction: column; }

header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; gap: 10px; flex-wrap: wrap; }
.btn-back {
  background: #fff; border: var(--line); box-shadow: 4px 4px 0 var(--ink);
  border-radius: 999px; padding: 8px 18px; font-weight: 800; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
}

.level-selector { display: flex; gap: 4px; background: #fff; padding: 4px; border: var(--line); border-radius: 999px; box-shadow: 3px 3px 0 var(--ink); }
.lvl-btn {
  border: none; background: transparent; padding: 6px 12px; font-family: var(--display);
  font-weight: 800; font-size: 12px; border-radius: 999px; cursor: pointer; transition: 0.1s;
}
.lvl-btn.active[data-lvl="A0"] { background: #e0e0e0; border: 2px solid var(--ink); }
.lvl-btn.active[data-lvl="A1"] { background: var(--lime); border: 2px solid var(--ink); }
.lvl-btn.active[data-lvl="A2"] { background: var(--yellow); border: 2px solid var(--ink); }
.lvl-btn.active[data-lvl="B1"] { background: var(--cyan); border: 2px solid var(--ink); }
.lvl-btn.active[data-lvl="B2"] { background: var(--orange); color: #fff; border: 2px solid var(--ink); }

.mode-toggle { display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; }
.mode-btn {
  background: #fff; border: var(--line); box-shadow: 3px 3px 0 var(--ink);
  padding: 6px 18px; border-radius: 999px; font-weight: 800; cursor: pointer; font-size: 14px;
}
.mode-btn.active { background: var(--pink); color: #fff; }

.chat-card {
  flex: 1; display: flex; flex-direction: column; background: #fff;
  border: var(--line); box-shadow: 6px 6px 0 var(--ink); border-radius: 24px;
  margin-bottom: 20px; overflow: hidden; height: 62vh;
}

.topic-badge {
  background: var(--paper); border-bottom: var(--line); padding: 10px 16px;
  font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; align-items: center;
}
.new-topic-btn {
  background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
  padding: 4px 12px; font-weight: 800; font-size: 12px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
}

.messages { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.messages::-webkit-scrollbar { width: 8px; }
.messages::-webkit-scrollbar-track { background: var(--paper); }
.messages::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 4px; }

.msg-row { display: flex; gap: 10px; max-width: 88%; align-items: flex-end; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.ai { align-self: flex-start; }

.avatar {
  width: 42px; height: 42px; border-radius: 50%; border: var(--line);
  display: grid; place-items: center; font-size: 20px; background: var(--yellow); flex-shrink: 0;
  box-shadow: 2px 2px 0 var(--ink);
}
.msg-row.user .avatar { background: var(--pink); }

.bubble {
  border: var(--line); box-shadow: 4px 4px 0 var(--ink);
  border-radius: 20px; padding: 12px 18px; font-size: 16px; line-height: 1.4;
  word-break: break-word;
}
.msg-row.user .bubble { background: var(--pink); color: #fff; border-bottom-right-radius: 4px; }
.msg-row.ai .bubble { background: var(--cyan); border-bottom-left-radius: 4px; }

.typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
.dot { width: 8px; height: 8px; background: var(--ink); border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
.dot:nth-child(1) { animation-delay: 0s; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

.input-box { display: flex; gap: 10px; padding: 14px; background: #fff; border-top: var(--line); }
.chat-input {
  flex: 1; border: var(--line); border-radius: 16px; padding: 12px 16px;
  font-family: var(--body); font-size: 16px; font-weight: 700; outline: none; background: #fafafa;
}

.send-btn, .mic-btn {
  background: var(--yellow); border: var(--line); box-shadow: 3px 3px 0 var(--ink);
  border-radius: 16px; padding: 0 22px; font-family: var(--display); font-weight: 800; cursor: pointer;
}
.mic-btn { background: var(--violet); color: #fff; display: none; width: 100%; justify-content: center; align-items: center; padding: 14px; gap: 8px; font-size: 15px; }
.mic-btn.recording { background: var(--pink); }

.btn-settings {
  background: #fff; border: var(--line); box-shadow: 3px 3px 0 var(--ink);
  border-radius: 999px; width: 42px; height: 42px; font-size: 18px; cursor: pointer;
}
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }
.retry-btn {
  margin-top: 8px; margin-right: 6px; background: var(--yellow); border: 2px solid var(--ink);
  border-radius: 999px; padding: 4px 12px; font-family: var(--body); font-weight: 800; font-size: 13px; cursor: pointer;
}
.msg-row.ai .bubble.error { background: #ffd1d1; }

.modal-bg { position: fixed; inset: 0; background: rgba(27,16,48,.55); display: none; place-items: center; z-index: 50; padding: 16px; }
.modal-bg.open { display: grid; }
.modal {
  background: #fff; border: var(--line); box-shadow: 6px 6px 0 var(--ink); border-radius: 24px;
  padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
}
.modal h2 { font-family: var(--display); font-size: 18px; margin-bottom: 8px; }
.modal p.hint { font-size: 13px; line-height: 1.4; margin-bottom: 12px; font-weight: 700; opacity: .85; }
.modal label { display: block; font-size: 13px; font-weight: 800; margin: 10px 0 4px; }
.modal input {
  width: 100%; border: var(--line); border-radius: 12px; padding: 10px 12px;
  font-family: var(--body); font-size: 14px; font-weight: 700; background: #fafafa; outline: none;
}
.modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.modal-actions button {
  border: var(--line); border-radius: 999px; padding: 8px 16px; font-family: var(--body);
  font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); background: #fff;
}
.modal-actions .primary { background: var(--lime); }
.modal-status { margin-top: 10px; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
   <a href="../../index.html" onclick="if (history.length > 1) { history.back(); return false; }" class="btn-back" title="Назад на главную">← Назад</a>
    
    <div class="header-right">
    <div class="level-selector">
      <button class="lvl-btn active" data-lvl="A0" onclick="changeLevel('A0')">A0</button>
      <button class="lvl-btn" data-lvl="A1" onclick="changeLevel('A1')">A1</button>
      <button class="lvl-btn" data-lvl="A2" onclick="changeLevel('A2')">A2</button>
      <button class="lvl-btn" data-lvl="B1" onclick="changeLevel('B1')">B1</button>
      <button class="lvl-btn" data-lvl="B2" onclick="changeLevel('B2')">B2</button>
    </div>
    </div>
  </header>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btnModeText" onclick="setMode('text')">✍️ Текстом</button>
    <button class="mode-btn" id="btnModeVoice" onclick="setMode('voice')">🎤 Голосом</button>
  </div>

  <div class="chat-card">
    <div class="topic-badge">
      <span>🎯 Тема: <b id="currentTopicName">Загрузка...</b></span>
      <button class="new-topic-btn" onclick="startNewConversation()">🎲 Сменить тему</button>
    </div>

    <div class="messages" id="messages"></div>

    <form class="input-box" id="textForm">
      <input type="text" id="userInput" class="chat-input" placeholder="Напишите ответ..." autocomplete="off">
      <button type="submit" class="send-btn" id="sendBtn">🚀</button>
    </form>

    <div class="input-box" id="voiceBox" style="display: none;">
      <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
        <span>🎙️ Нажмите и говорите на немецком</span>
      </button>
    </div>
  </div>
</div>


<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>⚙️ Настройки ИИ</h2>
    <p class="hint">По умолчанию чат пробует бесплатные серверы Pollinations без ключа. Если они перегружены или просят ключ — вставьте свой ключ (бесплатно на enter.pollinations.ai) или адрес любого OpenAI-совместимого API.</p>
    <label for="cfgUrl">Адрес API (chat/completions)</label>
    <input id="cfgUrl" type="text" autocomplete="off">
    <label for="cfgModel">Модель</label>
    <input id="cfgModel" type="text" autocomplete="off">
    <label for="cfgKey">API-ключ (необязательно)</label>
    <input id="cfgKey" type="password" autocomplete="off" placeholder="pk_... или sk-...">
    <div class="modal-status" id="cfgStatus"></div>
    <div class="modal-actions">
      <button class="primary" onclick="saveSettings()">💾 Сохранить</button>
      <button onclick="testConnection()">🔌 Проверить</button>
      <button onclick="resetSettings()">↩︎ Сбросить</button>
      <button onclick="closeSettings()">Закрыть</button>
    </div>
  </div>
</div>

<script>
const MAX_HISTORY = 10;
const REQUEST_TIMEOUT_MS = 40000;

const DEFAULT_CFG = {
  url: 'https://gen.pollinations.ai/v1/chat/completions',
  model: 'openai',
  key: ''
};

// Запасные бесплатные эндпоинты (используются, только если не менялись настройки)
const FALLBACKS = [
  { url: 'https://text.pollinations.ai/openai', model: 'openai' },
  { url: 'https://text.pollinations.ai/', model: 'openai' }
];

const topics = [
  { de: "Begrüßung und Name", ru: "Знакомство и имя" },
  { de: "Einkaufen im Supermarkt", ru: "Покупки в магазине" },
  { de: "Essen und Trinken", ru: "Еда и напитки" },
  { de: "Hobbys und Freizeit", ru: "Хобби и время" },
  { de: "Wohnung und Haus", ru: "Дом и квартира" }
];

let currentLevel = 'A0';
let currentMode = 'text';
let currentTopic = null;
let chatHistory = [];      // [{role, content}], первый элемент — скрытая стартовая просьба
let isRecording = false;
let recognition = null;
let busy = false;
let requestId = 0;

/* ---------- Настройки ---------- */
function loadCfg() {
  try { return { ...DEFAULT_CFG, ...JSON.parse(localStorage.getItem('deutschai_cfg') || '{}') }; }
  catch (e) { return { ...DEFAULT_CFG }; }
}
function storeCfg(cfg) {
  try { localStorage.setItem('deutschai_cfg', JSON.stringify(cfg)); } catch (e) {}
}
function readForm() {
  return {
    url: document.getElementById('cfgUrl').value.trim() || DEFAULT_CFG.url,
    model: document.getElementById('cfgModel').value.trim() || DEFAULT_CFG.model,
    key: document.getElementById('cfgKey').value.trim()
  };
}
function openSettings() {
  const c = loadCfg();
  document.getElementById('cfgUrl').value = c.url;
  document.getElementById('cfgModel').value = c.model;
  document.getElementById('cfgKey').value = c.key;
  document.getElementById('cfgStatus').textContent = '';
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
function saveSettings() {
  storeCfg(readForm());
  document.getElementById('cfgStatus').textContent = '✅ Сохранено';
}
function resetSettings() {
  try { localStorage.removeItem('deutschai_cfg'); } catch (e) {}
  openSettings();
  document.getElementById('cfgStatus').textContent = '↩︎ Сброшено к значениям по умолчанию';
}
async function testConnection() {
  const status = document.getElementById('cfgStatus');
  status.textContent = '⏳ Проверяю...';
  const cfg = readForm();
  try {
    const reply = await callEndpoint(cfg, [{ role: 'user', content: 'Sag kurz "Hallo".' }]);
    status.textContent = '✅ Работает! Ответ: ' + reply.slice(0, 60);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
}

/* ---------- Запрос к ИИ ---------- */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function extractText(raw) {
  const t = (raw || '').trim();
  if (!t) return '';
  if (t[0] === '{' || t[0] === '[') {
    try {
      const j = JSON.parse(t);
      if (j.error) throw new Error(typeof j.error === 'string' ? j.error : (j.error.message || 'Ошибка сервера'));
      const c = j.choices && j.choices[0];
      if (c) {
        const msg = (c.message && c.message.content) || c.text || '';
        if (msg) return String(msg).trim();
      }
      if (typeof j.content === 'string') return j.content.trim();
      if (typeof j.text === 'string') return j.text.trim();
      if (typeof j.response === 'string') return j.response.trim();
    } catch (e) {
      if (e instanceof SyntaxError) return t; // это просто текст, похожий на JSON
      throw e;
    }
  }
  return t;
}

async function callEndpoint(ep, messages, attempt = 0) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  const headers = { 'Content-Type': 'application/json' };
  if (ep.key) headers['Authorization'] = 'Bearer ' + ep.key;

  let response;
  try {
    response = await fetch(ep.url, {
      method: 'POST',
      headers,
      signal: ctrl.signal,
      body: JSON.stringify({ model: ep.model, messages, temperature: 0.7, stream: false })
    });
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('Сервер слишком долго не отвечает');
    throw new Error('Нет соединения с сервером (сеть или CORS)');
  }
  clearTimeout(timer);

  if ((response.status === 429 || response.status >= 500) && attempt < 1) {
    await sleep(1500);
    return callEndpoint(ep, messages, attempt + 1);
  }
  const raw = await response.text();
  if (!response.ok) {
    if (response.status === 401 || response.status === 402 || response.status === 403)
      throw new Error('Сервер требует API-ключ (' + response.status + ')');
    if (response.status === 429) throw new Error('Слишком много запросов (429), подождите немного');
    throw new Error('Ошибка сервера ' + response.status);
  }
  const text = extractText(raw);
  if (!text) throw new Error('Пустой ответ от сервера');
  return text;
}

async function askAI(messages) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  let res;
  try {
    res = await fetch('/.netlify/functions/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({ messages })
    });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер слишком долго не отвечает');
    throw new Error('Нет связи с сервером');
  } finally { clearTimeout(timer); }
  if (res.status === 429) throw new Error('Много запросов сразу, подождите минуту');
  if (res.status === 404) throw new Error('Серверная функция не найдена (сайт нужно деплоить через GitHub)');
  if (res.status === 500) throw new Error('На сервере не настроен ключ GROQ_API_KEY');
  if (!res.ok) throw new Error('Ошибка сервера ' + res.status);
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content?.trim();
  if (!text) throw new Error('Пустой ответ от сервера');
  return text;
}

function buildSystemPrompt() {
  return `Ты — дружелюбный тигр 🐯, терпеливый и умный репетитор немецкого языка.
Уровень ученика: ${currentLevel}.
Текущая тема: "${currentTopic.de}".

ПРАВИЛА И ПОВЕДЕНИЕ:
1. Если уровень A0:
   - Пиши 1 очень простую короткую фразу на немецком и СРАЗУ же давай перевод на русский в скобках.
2. Если уровень A1-B2:
   - Отвечай только на немецком, соотноси сложность фраз с уровнем.
3. ОБРАБОТКА ОШИБОК И АБРАКАДАБРЫ:
   - Если пользователь ввел набор букв / бессмыслицу (например, "asdf", "ывавы"):
     Переспроси на русском/немецком: "Кажется, это опечатка или случайный набор букв! Попробуй еще раз или спроси, как что-то переводится 🙂".
   - Если пользователь сделал орфографическую или грамматическую ошибку:
     Выдели исправление отдельной строкой: "✏️ *Исправление:* [как правильно]"
4. ВСЕГДА задавай ровно один простой вопрос по теме в конце ответа, чтобы развивать диалог.
5. Оставайся в роли репетитора и не выходи из темы урока.`;
}

function buildPayload() {
  const opener = chatHistory[0];
  const rest = chatHistory.slice(1).slice(-MAX_HISTORY);
  // История должна начинаться с сообщения пользователя
  while (rest.length && rest[0].role !== 'user') rest.shift();
  return [{ role: 'system', content: buildSystemPrompt() }, opener, ...rest];
}

function setBusy(v) {
  busy = v;
  document.getElementById('sendBtn').disabled = v;
  document.getElementById('userInput').disabled = v;
  document.getElementById('micBtn').disabled = v;
}

async function fetchAiResponse() {
  if (busy) return;
  const myId = ++requestId;
  setBusy(true);
  showTypingIndicator();

  try {
    const reply = await askAI(buildPayload());
    if (myId !== requestId) return; // тема/уровень сменились, ответ устарел
    hideTypingIndicator();
    chatHistory.push({ role: 'assistant', content: reply });
    addMessage(reply, 'ai');
  } catch (err) {
    if (myId !== requestId) return;
    hideTypingIndicator();
    addErrorMessage(err.message);
  } finally {
    if (myId === requestId) {
      setBusy(false);
      if (currentMode === 'text') document.getElementById('userInput').focus();
    }
  }
}

/* ---------- Диалог ---------- */
window.addEventListener('DOMContentLoaded', startNewConversation);

function startNewConversation() {
  requestId++;            // отменяем возможный «висящий» запрос
  setBusy(false);
  window.speechSynthesis && window.speechSynthesis.cancel();
  currentTopic = topics[Math.floor(Math.random() * topics.length)];
  document.getElementById('currentTopicName').textContent = `${currentTopic.de} (${currentTopic.ru})`;
  document.getElementById('messages').innerHTML = '';
  chatHistory = [{
    role: 'user',
    content: `Поздоровайся и начни диалог по теме "${currentTopic.de}" для уровня ${currentLevel}.`
  }];
  fetchAiResponse();
}

function changeLevel(lvl) {
  currentLevel = lvl;
  document.querySelectorAll('.lvl-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lvl === lvl));
  startNewConversation();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnModeText').classList.toggle('active', mode === 'text');
  document.getElementById('btnModeVoice').classList.toggle('active', mode === 'voice');
  document.getElementById('textForm').style.display = mode === 'text' ? 'flex' : 'none';
  document.getElementById('voiceBox').style.display = mode === 'voice' ? 'flex' : 'none';
  document.querySelector('.mic-btn').style.display = mode === 'voice' ? 'flex' : 'none';
  if (mode === 'text') window.speechSynthesis && window.speechSynthesis.cancel();
}

/* ---------- Сообщения ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function formatText(s) {
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/\n/g, '<br>');
}

function makeRow(sender) {
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender === 'user' ? '👤' : '🐯';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(avatar);
  row.appendChild(bubble);
  return { row, bubble };
}

function addMessage(text, sender = 'user') {
  const messagesEl = document.getElementById('messages');
  const { row, bubble } = makeRow(sender);
  bubble.innerHTML = formatText(text);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (sender === 'ai' && currentMode === 'voice') speakText(text);
}

function addErrorMessage(reason) {
  const messagesEl = document.getElementById('messages');
  const { row, bubble } = makeRow('ai');
  bubble.classList.add('error');
  bubble.appendChild(document.createTextNode('❌ Не удалось получить ответ: ' + reason + '.'));
  bubble.appendChild(document.createElement('br'));

  const retry = document.createElement('button');
  retry.className = 'retry-btn';
  retry.textContent = '🔄 Повторить';
  retry.onclick = () => { row.remove(); fetchAiResponse(); };

  const settings = document.createElement('button');
  settings.className = 'retry-btn';
  settings.textContent = '⚙️ Настройки';
  settings.onclick = openSettings;

  bubble.appendChild(retry);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTypingIndicator() {
  const messagesEl = document.getElementById('messages');
  const { row, bubble } = makeRow('ai');
  row.id = 'typingIndicator';
  bubble.innerHTML = '<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function sendUserText(text) {
  if (busy) return;
  text = text.trim();
  if (!text) return;
  addMessage(text, 'user');
  chatHistory.push({ role: 'user', content: text });
  fetchAiResponse();
}

document.getElementById('textForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('userInput');
  const text = input.value;
  input.value = '';
  sendUserText(text);
});

/* ---------- Голос ---------- */
function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  // Озвучиваем только немецкую часть: убираем русский перевод в скобках, разметку и эмодзи
  const clean = text
    .replace(/\([^)]*\)/g, ' ')
    .replace(/✏️[^\n]*/g, ' ')
    .replace(/[*_`#]/g, '')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
    .trim();
  if (!clean) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'de-DE';
  u.rate = (currentLevel === 'A0' || currentLevel === 'A1') ? 0.8 : 1.0;
  window.speechSynthesis.speak(u);
}

function resetMicUi() {
  isRecording = false;
  const micBtn = document.getElementById('micBtn');
  micBtn.classList.remove('recording');
  micBtn.querySelector('span').textContent = '🎙️ Нажмите и говорите на немецком';
}

function toggleRecording() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('Ваш браузер не поддерживает распознавание речи. Попробуйте Chrome или Edge.');
    return;
  }
  if (isRecording && recognition) { recognition.stop(); return; }
  if (busy) return;

  window.speechSynthesis && window.speechSynthesis.cancel();
  recognition = new SR();
  recognition.lang = 'de-DE';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    const micBtn = document.getElementById('micBtn');
    micBtn.classList.add('recording');
    micBtn.querySelector('span').textContent = '⏹️ Слушаю... (Завершить)';
  };
  recognition.onresult = (event) => sendUserText(event.results[0][0].transcript);
  recognition.onerror = (e) => {
    resetMicUi();
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      alert('Нет доступа к микрофону. Разрешите его в настройках браузера (нужен https или localhost).');
  };
  recognition.onend = resetMicUi;
  recognition.start();
}
</script>
