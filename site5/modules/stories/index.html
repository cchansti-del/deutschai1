<style>
:root{--ink:#1b1030;--paper:#fff3dc;--pink:#ff3d9a;--yellow:#ffd60a;--cyan:#22d3ee;--lime:#b8f03c;--violet:#8b5cf6;--orange:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:700;color:var(--ink);background:var(--paper);
 background-image:radial-gradient(rgba(27,16,48,.14) 1.3px,transparent 1.5px);background-size:26px 26px;min-height:100vh;padding-bottom:60px}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);padding:8px 16px;border-radius:999px;font-weight:800;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.title-area{margin:20px 0 30px}
h1{font-family:'Unbounded';font-size:clamp(24px,4vw,38px);line-height:1.2}

/* Фильтр уровней */
.levels{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.lvl-btn{background:#fff;border:3px solid var(--ink);padding:8px 18px;border-radius:999px;font-family:'Unbounded';font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:all .15s}
.lvl-btn.active{background:var(--orange);color:#fff;transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}

/* Инструкция */
.hint{background:var(--lime);border:3px solid var(--ink);border-radius:16px;padding:12px 18px;margin-bottom:24px;box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;gap:10px;font-size:15px}

/* Карточка текста */
.story-card{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:30px;box-shadow:8px 8px 0 var(--ink);position:relative}
.story-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:3px solid var(--paper);padding-bottom:15px}
.story-title{font-family:'Unbounded';font-size:20px}
.story-badge{background:var(--yellow);border:2px solid var(--ink);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:800}

/* Текст и слова */
.story-body{font-size:19px;line-height:1.8;color:#2c1c4d}
.story-body p{margin-bottom:16px}
.word{display:inline-block;cursor:pointer;padding:0 2px;border-radius:4px;transition:background .15s,color .15s}
.word:hover{background:var(--cyan);color:var(--ink)}
.word.active{background:var(--pink);color:#fff}

/* Всплывающее окно перевода */
.popover{position:absolute;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;border:3px solid var(--yellow);box-shadow:0 10px 20px rgba(0,0,0,.25);z-index:100;display:none;transform:translate(-50%,-100%);margin-top:-10px;text-align:center}
.popover::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-width:8px 8px 0;border-style:solid;border-color:var(--yellow) transparent}
.popover-de{font-family:'Unbounded';font-size:15px;color:var(--yellow);margin-bottom:2px}
.popover-ru{font-size:14px;font-weight:600}
</style>
</head>

let currentLvl = "A0";

function renderStory(lvl) {
  const data = stories[lvl];
  document.getElementById('storyTitle').textContent = data.title;
  document.getElementById('storyLvl').textContent = lvl;

  let html = '';
  data.paragraphs.forEach(paragraph => {
    html += '<p>';
    const tokens = paragraph.split(/(\s+)/);
    tokens.forEach(token => {
      if (/^\s+$/.test(token)) {
        html += token;
      } else {
        const cleanWord = token.replace(/[.,!?:;"'()]/g, '');
        html += `<span class="word" data-word="${cleanWord}">${token}</span>`;
      }
    });
    html += '</p>';
  });

  document.getElementById('storyBody').innerHTML = html;
}

// Выбор уровня
document.querySelectorAll('.lvl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLvl = btn.dataset.lvl;
    renderStory(currentLvl);
    hidePopover();
  });
});

// Перевод по клику
const popover = document.getElementById('popover');
const popDe = document.getElementById('popDe');
const popRu = document.getElementById('popRu');
let activeSpan = null;

document.getElementById('storyBody').addEventListener('click', (e) => {
  const wordSpan = e.target.closest('.word');
  if (!wordSpan) {
    hidePopover();
    return;
  }

  if (activeSpan) activeSpan.classList.remove('active');
  activeSpan = wordSpan;
  activeSpan.classList.add('active');

  const rawWord = wordSpan.dataset.word;
  const lowerWord = rawWord.toLowerCase();
  const translation = dictionary[lowerWord] || rawWord;

  popDe.textContent = rawWord;
  popRu.textContent = translation;

  const rect = wordSpan.getBoundingClientRect();
  popover.style.left = `${rect.left + rect.width / 2 + window.scrollX}px`;
  popover.style.top = `${rect.top + window.scrollY}px`;
  popover.style.display = 'block';
});

function hidePopover() {
  popover.style.display = 'none';
  if (activeSpan) {
    activeSpan.classList.remove('active');
    activeSpan = null;
  }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.story-card') && !e.target.closest('.popover')) {
    hidePopover();
  }
});

// Инициализация
renderStory("A0");
